# DRAFT — GitHub Action for nightly secscan runs (not published yet).
# Fill in YOUR repo details and secrets; the security gate below shows how a
# new CRITICAL/HIGH finding fails the run so notifications fire.
#
# Required repo secrets:
#   SECSCAN_KEY_B64 : base64 of the signing key (secscan keygen; base64 < secret.key)
#   SCAN_TARGET     : host you are authorized to scan
#   SCAN_OWNER      : authorizer email
name: secscan-nightly
on:
  schedule:
    - cron: "17 3 * * *"   # nightly, off the hour
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install secscan + tools
        run: |
          pip install secscan  # TODO: your package index / repo URL
          # optional deeper checks:
          # pip install ssh-audit

      - name: Restore signing key
        run: |
          mkdir -p ~/.secscan
          echo "${{ secrets.SECSCAN_KEY_B64 }}" | base64 -d > ~/.secscan/secret.key
          chmod 600 ~/.secscan/secret.key

      - name: Scan (targets must be pre-authorized or authorize here)
        run: |
          secscan authorize --target "${{ secrets.SCAN_TARGET }}" \
            --owner "${{ secrets.SCAN_OWNER }}" --days 7
          secscan scan --target "${{ secrets.SCAN_TARGET }}" \
            --plain-language --out report.html --json scan-new.json

      - name: Drift diff vs previous scan
        continue-on-error: false
        run: |
          if [ -f scan-prev.json ]; then
            secscan diff scan-prev.json scan-new.json --out drift.txt
          fi
          # exit code 10 = new CRITICAL/HIGH findings -> job fails -> alert
          secscan diff scan-prev.json scan-new.json || code=$?
          exit $(( code == 10 ? 1 : 0 ))

      - uses: actions/upload-artifact@v4
        with:
          name: secscan-report
          path: |
            report.html
            scan-new.json
