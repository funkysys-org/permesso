[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secscan"
version = "0.1.0"
description = "Authorized scan + hardening reports for websites and servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "secscan" }]
keywords = ["security", "scanner", "hardening", "nuclei", "report"]
dependencies = [] # v0 is stdlib-only by design

[project.scripts]
secscan = "secscan.cli:main"

[tool.setuptools.packages.find]
include = ["secscan*"]
