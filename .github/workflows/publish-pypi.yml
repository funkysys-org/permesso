# Publish permesso to PyPI on version tags — INACTIVE until a Trusted
# NOTE: this file MUST live in .github/workflows/ to run — do not move it back.
# Publisher is registered on PyPI (no tokens, no secrets needed):
#
#   1. Verify the name is free / claim it: https://pypi.org (project "permesso")
#   2. If the project doesn't exist yet: create a placeholder project or use
#      "pending publisher" during first publish; PyPI then binds this repo.
#      Manual path for the FIRST release: pypi.org → Your account →
#      Publishing → add GitHub Trusted Publisher:
#        owner: funkysys-org   repository: permesso
#        workflow: publish-pypi.yml   environment: pypi
#   3. Then: git tag v0.2.0 && git push origin v0.2.0  → this workflow builds
#      the sdist+wheel and publishes them via OIDC.
name: publish-pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  id-token: write   # OIDC — required by Trusted Publishing
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
