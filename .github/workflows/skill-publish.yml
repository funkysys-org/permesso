# ClawHub skill publish — NATIVE workflow (no cross-repo reusable workflow:
# org Actions policies commonly block those with a silent startup_failure;
# this one only uses GitHub-owned actions + the clawhub CLI in shell).
#
# Setup (one-time, owner): run `clawhub token` on your logged-in machine,
# paste the result as repo secret CLAWHUB_TOKEN. Until then every run goes
# green with a notice and publishes nothing.
#
# Publishing a skill on ClawHub releases its text under MIT-0 (registry rule).
name: ClawHub skill publish
on:
  push:
    branches: [main]
    paths: ["skills/**", ".github/workflows/skill-publish.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Publish skill to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::notice::CLAWHUB_TOKEN secret not set — publish skipped. Create a token with 'clawhub token' and add it to the repo secrets to enable CI publishing."
            exit 0
          fi
          npm install -g clawhub
          clawhub login --token "$CLAWHUB_TOKEN" --no-input || {
            echo "::error::clawhub login failed — the CLAWHUB_TOKEN secret is invalid or malformed. Run 'clawhub whoami' locally to verify your session, 'clawhub token' to print the exact value, and paste it with no quotes, spaces or newlines."
            exit 1
          }
          clawhub skill publish skills/permesso \
            --slug permesso --name "permesso" \
            --categories security,operations \
            --topics "vulnerability-scanning,hardening,reports"
